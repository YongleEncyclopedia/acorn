name: Android app

# The Android app (android/): the reader in a WebView, connecting to a 松果 that runs on a computer or NAS.
# A pull request that touches it, or a run started by hand, leaves the APK as a workflow artifact to download and
# try. Pushing a tag such as v0.2.0 (matching "version" in package.json) also attaches it to that version's draft
# release, the one desktop.yml fills with the desktop installers.
#
# Signing: with the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD the APK is signed with that release key; without them with a throwaway debug key, which
# installs fine but cannot update an APK from another build (see 安卓手机 in the README).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Release key, if the repository has one
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ACORN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret, so this APK is signed with a debug key"
          fi
      - name: Test and build
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
        env:
          ACORN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ACORN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ACORN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Name the APK
        run: |
          version=$(node -p "require('../package.json').version")
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Acorn-$version-android.apk"
          echo "APK=android/dist/Acorn-$version-android.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: acorn-android
          path: ${{ env.APK }}
          if-no-files-found: error
      - name: Attach it to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          # the desktop workflow may have drafted it already; otherwise draft it the way electron-builder does
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --draft --title "${tag#v}" --notes ""
          gh release upload "$tag" "$APK" --clobber
