name: Desktop app

# Installers for macOS, Windows and Linux (desktop/electron-builder.yml).
# Pushing a tag such as v0.2.0 — matching "version" in package.json — builds all three and attaches them to a
# draft release, to look over and publish on GitHub. A pull request that touches the app, or a run started by
# hand, leaves them as workflow artifacts to download and try.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["desktop/**", "src/server/lock.ts", "web/src/lib/desktop.ts", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --arm64 --x64
          - os: windows-latest
            target: --win --x64
          - os: ubuntu-latest
            target: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: desktop
      - name: Build the installers
        working-directory: desktop
        run: npm run dist -- ${{ matrix.target }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: acorn-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
