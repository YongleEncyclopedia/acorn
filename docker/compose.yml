# Acorn + a private RSSHub instance.
#   docker compose -f docker/compose.yml up -d
# Set the password first (requests reach the container from Docker's network, so the browser
# "first run" setup is not offered):  ACORN_PASSWORD=… docker compose -f docker/compose.yml up -d
# RSSHub is reachable from Acorn at http://rsshub:1200; a local Ollama at http://host.docker.internal:11434.
# Cookies for Bilibili / Weibo / Zhihu routes go into the rsshub environment (see https://docs.rsshub.app/deploy/config).
services:
  acorn:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "7700:7700"
    volumes:
      - ../data:/data
      - ../plugins:/app/plugins
    environment:
      ACORN_PASSWORD: ${ACORN_PASSWORD:-}
      RSSHUB_BASE: http://rsshub:1200
      ACORN_PUBLIC_URL: ${ACORN_PUBLIC_URL:-http://localhost:7700}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rsshub
  rsshub:
    image: diygod/rsshub:chromium-bundled
    restart: unless-stopped
    ports:
      - "127.0.0.1:1200:1200"
    environment:
      NODE_ENV: production
      CACHE_EXPIRE: 900
      # BILIBILI_COOKIE_2267573: ""
      # WEIBO_COOKIES: ""
      # ZHIHU_COOKIES: ""
